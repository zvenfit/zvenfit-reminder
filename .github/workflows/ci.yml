name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Start local YDB
        run: |
          docker compose up -d ydb
          ./scripts/ydb-local-init.sh
      - name: Run YDB integration smoke
        env:
          RUN_YDB_INTEGRATION: "1"
          YDB_ENDPOINT: grpc://localhost:2136
          YDB_DATABASE: /local
          YDB_ANONYMOUS_CREDENTIALS: "1"
        run: npm test --workspace=@zvenfit-reminder/shared -- read-queries.integration.test.ts
      - name: Stop local YDB
        if: always()
        run: docker compose down -v
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Mini App E2E
        run: npm run test:e2e

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate deploy configuration
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_RUNTIME_SERVICE_ACCOUNT_ID: ${{ secrets.YC_RUNTIME_SERVICE_ACCOUNT_ID }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_PROXY_SECRET: ${{ secrets.TELEGRAM_PROXY_SECRET }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
        run: |
          : "${YC_SA_JSON:?Missing production secret YC_SA_JSON}"
          : "${YC_FOLDER_ID:?Missing production secret YC_FOLDER_ID}"
          : "${YC_RUNTIME_SERVICE_ACCOUNT_ID:?Missing production secret YC_RUNTIME_SERVICE_ACCOUNT_ID}"
          : "${YC_BUCKET:?Missing production secret YC_BUCKET}"
          : "${BOT_TOKEN:?Missing production secret BOT_TOKEN}"
          : "${WEBHOOK_SECRET:?Missing production secret WEBHOOK_SECRET}"
          : "${WEBHOOK_URL:?Missing production secret WEBHOOK_URL}"
          : "${TELEGRAM_WEBHOOK_URL:?Missing production secret TELEGRAM_WEBHOOK_URL}"
          : "${TELEGRAM_PROXY_SECRET:?Missing production secret TELEGRAM_PROXY_SECRET}"
          : "${YDB_ENDPOINT:?Missing production secret YDB_ENDPOINT}"
          : "${YDB_DATABASE:?Missing production secret YDB_DATABASE}"
          : "${MINI_APP_URL:?Missing production secret MINI_APP_URL}"
      - run: npm ci
      - name: Build production artifacts
        env:
          VITE_API_BASE_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm run build
      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Configure YC
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON" > sa-key.json
          yc config profile create ci
          yc config set service-account-key sa-key.json
          yc config set folder-id "$YC_FOLDER_ID"
      - name: Resolve production log group
        run: |
          log_group_json="$(yc logging group get --name zvenfit-reminder --format json)"
          log_group_id="$(printf '%s' "$log_group_json" | jq -er .id)"
          echo "YC_LOG_GROUP_ID=$log_group_id" >> "$GITHUB_ENV"
      - name: Install YDB CLI
        run: |
          ydb_cli_dir="$RUNNER_TEMP/ydb-cli"
          mkdir -p "$ydb_cli_dir"
          curl -fsSLo "$ydb_cli_dir/ydb" \
            https://storage.yandexcloud.net/yandexcloud-ydb/release/2.31.0/linux/amd64/ydb
          chmod +x "$ydb_cli_dir/ydb"
          echo "$ydb_cli_dir" >> "$GITHUB_PATH"
          "$ydb_cli_dir/ydb" version
      - name: Apply YDB migrations
        env:
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          SA_KEY_FILE: ${{ github.workspace }}/sa-key.json
        run: ./scripts/apply-ydb-migrations.sh
      - name: Package bot-webhook
        run: |
          cd functions/bot-webhook
          npm run build
          cd dist
          zip -9 -r ../../../bot-webhook.zip .
      - name: Package reminder-cron
        run: |
          cd functions/reminder-cron
          npm run build
          cd dist
          zip -9 -r ../../../reminder-cron.zip .
      - name: Verify function archive sizes
        run: node scripts/verify-function-archives.mjs bot-webhook.zip reminder-cron.zip
      - name: Deploy bot-webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
          DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_PROXY_SECRET: ${{ secrets.TELEGRAM_PROXY_SECRET }}
          YC_RUNTIME_SERVICE_ACCOUNT_ID: ${{ secrets.YC_RUNTIME_SERVICE_ACCOUNT_ID }}
          EXPECTED_BOT_USERNAME: zvenfit_reminder_bot
        run: |
          telegram_api_root="$(TELEGRAM_WEBHOOK_URL="$TELEGRAM_WEBHOOK_URL" node --input-type=module -e '
            const url = new URL(process.env.TELEGRAM_WEBHOOK_URL);
            if (url.protocol !== "https:" || !url.hostname.endsWith(".workers.dev")) {
              throw new Error("TELEGRAM_WEBHOOK_URL must use workers.dev");
            }
            process.stdout.write(`${url.origin}/telegram`);
          ')"
          bot_info_response="$(curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/getMe")"
          bot_info_json="$(printf '%s' "$bot_info_response" | jq -ce \
            --arg expected "$EXPECTED_BOT_USERNAME" '
            if .ok == true and
              (.result.id | type) == "number" and
              .result.username == $expected
            then .result
            else error("Telegram getMe returned an unexpected bot")
            end
          ')"
          yc serverless function version create \
            --function-name zvenfit-reminder-bot \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 30s \
            --service-account-id "$YC_RUNTIME_SERVICE_ACCOUNT_ID" \
            --log-group-id "$YC_LOG_GROUP_ID" \
            --min-log-level info \
            --source-path bot-webhook.zip \
            --environment BOT_TOKEN="$BOT_TOKEN" \
            --environment WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --environment YDB_ENDPOINT="$YDB_ENDPOINT" \
            --environment YDB_DATABASE="$YDB_DATABASE" \
            --environment MINI_APP_URL="$MINI_APP_URL" \
            --environment DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Moscow}" \
            --environment TELEGRAM_API_ROOT="$telegram_api_root" \
            --environment TELEGRAM_PROXY_SECRET="$TELEGRAM_PROXY_SECRET" \
            --environment NODE_ENV=production \
            --environment BOT_INFO_JSON="$bot_info_json"
      - name: Verify runtime dependencies from function runtime
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          health_event="$(jq -nc --arg secret "$WEBHOOK_SECRET" '{
            httpMethod: "POST",
            path: "/health/runtime",
            headers: {"X-Telegram-Bot-Api-Secret-Token": $secret}
          }')"
          health_response="$(yc serverless function invoke zvenfit-reminder-bot --data "$health_event")"
          printf '%s' "$health_response" | jq -e '
            .statusCode == 200 and
            ((.body | fromjson).ok == true)
          ' >/dev/null
      - name: Deploy reminder-cron
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_PROXY_SECRET: ${{ secrets.TELEGRAM_PROXY_SECRET }}
          YC_RUNTIME_SERVICE_ACCOUNT_ID: ${{ secrets.YC_RUNTIME_SERVICE_ACCOUNT_ID }}
        run: |
          telegram_api_root="$(TELEGRAM_WEBHOOK_URL="$TELEGRAM_WEBHOOK_URL" node --input-type=module -e '
            const url = new URL(process.env.TELEGRAM_WEBHOOK_URL);
            if (url.protocol !== "https:" || !url.hostname.endsWith(".workers.dev")) {
              throw new Error("TELEGRAM_WEBHOOK_URL must use workers.dev");
            }
            process.stdout.write(`${url.origin}/telegram`);
          ')"
          yc serverless function version create \
            --function-name zvenfit-reminder-cron \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 60s \
            --service-account-id "$YC_RUNTIME_SERVICE_ACCOUNT_ID" \
            --log-group-id "$YC_LOG_GROUP_ID" \
            --min-log-level info \
            --source-path reminder-cron.zip \
            --environment BOT_TOKEN="$BOT_TOKEN" \
            --environment WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --environment YDB_ENDPOINT="$YDB_ENDPOINT" \
            --environment YDB_DATABASE="$YDB_DATABASE" \
            --environment DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Moscow}" \
            --environment TELEGRAM_API_ROOT="$telegram_api_root" \
            --environment TELEGRAM_PROXY_SECRET="$TELEGRAM_PROXY_SECRET" \
            --environment NODE_ENV=production
      - name: Upload Mini App
        env:
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: yc storage s3 cp --recursive mini-app/dist/ "s3://${YC_BUCKET}/"
      - name: Set Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          telegram_webhook_url="$(TELEGRAM_WEBHOOK_URL="$TELEGRAM_WEBHOOK_URL" node --input-type=module -e '
            const url = new URL(process.env.TELEGRAM_WEBHOOK_URL);
            if (
              url.protocol !== "https:" ||
              !url.hostname.endsWith(".workers.dev") ||
              (url.pathname !== "/" && url.pathname !== "") ||
              url.search !== "" ||
              url.hash !== ""
            ) {
              throw new Error("TELEGRAM_WEBHOOK_URL must be a root workers.dev URL");
            }
            process.stdout.write(url.toString());
          ')"
          before_info="$(curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")"
          previous_error_date="$(printf '%s' "$before_info" | jq -er '.result.last_error_date // 0')"

          response="$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${telegram_webhook_url}" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query","chat_member"]')"
          printf '%s' "$response" | jq -e '.ok == true and .result == true' >/dev/null

          smoke_timestamp="$(date +%s)"
          smoke_payload="$(jq -nc --argjson timestamp "$smoke_timestamp" '{
            update_id: $timestamp,
            channel_post: {
              message_id: 1,
              date: $timestamp,
              chat: {id: 0, type: "channel", title: "Deploy smoke"},
              text: "health"
            }
          }')"
          curl -fsS -X POST "${telegram_webhook_url}" \
            --header "Content-Type: application/json" \
            --header "X-Telegram-Bot-Api-Secret-Token: ${WEBHOOK_SECRET}" \
            --data "$smoke_payload" \
            >/dev/null

          webhook_ready=false
          for attempt in {1..12}; do
            info="$(curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")"
            if printf '%s' "$info" | jq -e \
              --arg expected_url "$telegram_webhook_url" \
              --argjson previous_error_date "$previous_error_date" '
                .ok == true and
                .result.url == $expected_url and
                (.result.allowed_updates | sort) == (["message", "callback_query", "chat_member"] | sort) and
                .result.pending_update_count == 0 and
                ((.result.last_error_date // 0) <= $previous_error_date)
              ' >/dev/null; then
              webhook_ready=true
              break
            fi

            if printf '%s' "$info" | jq -e \
              --argjson previous_error_date "$previous_error_date" '
                .ok == true and
                ((.result.last_error_date // 0) > $previous_error_date)
              ' >/dev/null; then
              break
            fi

            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done

          printf '%s' "$info" | jq '{
            ok,
            webhook: {
              url: .result.url,
              ip_address: .result.ip_address,
              pending_update_count: .result.pending_update_count,
              last_error_date: .result.last_error_date,
              last_error_message: .result.last_error_message,
              allowed_updates: .result.allowed_updates
            }
          }'
          if [[ "$webhook_ready" != "true" ]]; then
            echo "Telegram webhook did not become healthy" >&2
            exit 1
          fi
