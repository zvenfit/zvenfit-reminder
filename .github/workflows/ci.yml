name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate deploy configuration
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
          UNIVERSAL_REMINDERS_ENABLED: ${{ vars.UNIVERSAL_REMINDERS_ENABLED || '0' }}
        run: |
          : "${YC_SA_JSON:?Missing production secret YC_SA_JSON}"
          : "${YC_FOLDER_ID:?Missing production secret YC_FOLDER_ID}"
          : "${YC_SERVICE_ACCOUNT_ID:?Missing production secret YC_SERVICE_ACCOUNT_ID}"
          : "${YC_BUCKET:?Missing production secret YC_BUCKET}"
          : "${BOT_TOKEN:?Missing production secret BOT_TOKEN}"
          : "${WEBHOOK_SECRET:?Missing production secret WEBHOOK_SECRET}"
          : "${WEBHOOK_URL:?Missing production secret WEBHOOK_URL}"
          : "${ALLOWED_CHAT_ID:?Missing production secret ALLOWED_CHAT_ID}"
          : "${YDB_ENDPOINT:?Missing production secret YDB_ENDPOINT}"
          : "${YDB_DATABASE:?Missing production secret YDB_DATABASE}"
          : "${MINI_APP_URL:?Missing production secret MINI_APP_URL}"
          if [[ "$UNIVERSAL_REMINDERS_ENABLED" != "1" ]]; then
            echo "Production variable UNIVERSAL_REMINDERS_ENABLED must be 1 for the universal Mini App rollout" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
      - name: Configure YC
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON" > sa-key.json
          yc config profile create ci
          yc config set service-account-key sa-key.json
          yc config set folder-id "$YC_FOLDER_ID"
      - name: Package bot-webhook
        run: |
          cd functions/bot-webhook
          npm run build
          cd dist
          zip -r ../../../bot-webhook.zip .
      - name: Package reminder-cron
        run: |
          cd functions/reminder-cron
          npm run build
          cd dist
          zip -r ../../../reminder-cron.zip .
      - name: Upload function packages
        env:
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: |
          yc storage s3 cp bot-webhook.zip "s3://${YC_BUCKET}/deployments/${GITHUB_SHA}/bot-webhook.zip"
          yc storage s3 cp reminder-cron.zip "s3://${YC_BUCKET}/deployments/${GITHUB_SHA}/reminder-cron.zip"
      - name: Deploy bot-webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
          DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          UNIVERSAL_REMINDERS_ENABLED: ${{ vars.UNIVERSAL_REMINDERS_ENABLED || '0' }}
        run: |
          admin_user_ids_args=()
          if [[ -n "$ADMIN_USER_IDS" ]]; then
            admin_user_ids_args+=(--environment "ADMIN_USER_IDS=$ADMIN_USER_IDS")
          fi
          yc serverless function version create \
            --function-name zvenfit-reminder-bot \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 30s \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --package-bucket-name "$YC_BUCKET" \
            --package-object-name "deployments/${GITHUB_SHA}/bot-webhook.zip" \
            --environment BOT_TOKEN="$BOT_TOKEN" \
            --environment WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --environment ALLOWED_CHAT_ID="$ALLOWED_CHAT_ID" \
            --environment YDB_ENDPOINT="$YDB_ENDPOINT" \
            --environment YDB_DATABASE="$YDB_DATABASE" \
            --environment MINI_APP_URL="$MINI_APP_URL" \
            --environment DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Moscow}" \
            --environment UNIVERSAL_REMINDERS_ENABLED="$UNIVERSAL_REMINDERS_ENABLED" \
            "${admin_user_ids_args[@]}"
      - name: Deploy reminder-cron
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          YDB_ENDPOINT: ${{ secrets.YDB_ENDPOINT }}
          YDB_DATABASE: ${{ secrets.YDB_DATABASE }}
          DEFAULT_TIMEZONE: ${{ secrets.DEFAULT_TIMEZONE }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          UNIVERSAL_REMINDERS_ENABLED: ${{ vars.UNIVERSAL_REMINDERS_ENABLED || '0' }}
        run: |
          yc serverless function version create \
            --function-name zvenfit-reminder-cron \
            --runtime nodejs22 \
            --entrypoint index.handler \
            --memory 256m \
            --execution-timeout 60s \
            --service-account-id "$YC_SERVICE_ACCOUNT_ID" \
            --package-bucket-name "$YC_BUCKET" \
            --package-object-name "deployments/${GITHUB_SHA}/reminder-cron.zip" \
            --environment BOT_TOKEN="$BOT_TOKEN" \
            --environment WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --environment ALLOWED_CHAT_ID="$ALLOWED_CHAT_ID" \
            --environment YDB_ENDPOINT="$YDB_ENDPOINT" \
            --environment YDB_DATABASE="$YDB_DATABASE" \
            --environment DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Moscow}" \
            --environment UNIVERSAL_REMINDERS_ENABLED="$UNIVERSAL_REMINDERS_ENABLED"
      - name: Remove function packages
        if: always()
        continue-on-error: true
        env:
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: |
          yc storage s3 rm "s3://${YC_BUCKET}/deployments/${GITHUB_SHA}/bot-webhook.zip"
          yc storage s3 rm "s3://${YC_BUCKET}/deployments/${GITHUB_SHA}/reminder-cron.zip"
      - name: Upload Mini App
        env:
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: yc storage s3 cp --recursive mini-app/dist/ "s3://${YC_BUCKET}/" --acl public-read
      - name: Set Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WEBHOOK_URL}/webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}"
